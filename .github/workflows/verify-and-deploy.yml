name: Verify & Deploy

on:
  push:
    branches:
      - "preview/**"
      - "main"
  workflow_dispatch:

concurrency:
  group: verify-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Phase 1 — TypeScript strict check
        run: npx tsc --noEmit

      - name: Phase 2 — ESLint (zero errors)
        run: npm run lint

      - name: Phase 3 — Test suite
        run: npm run test:run

      - name: Phase 4 — Production build
        run: npm run build
