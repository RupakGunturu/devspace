name: Verify & Deploy

on:
  push:
    branches:
      - "preview/**"
      - "main"
  workflow_dispatch:

concurrency:
  group: verify-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Phase 1 — TypeScript strict check
        run: npx tsc --noEmit

      - name: Phase 2 — ESLint (zero errors)
        run: npm run lint

      - name: Phase 3 — Test suite
        run: npm run test:run

      - name: Phase 4 — Production build
        run: npm run build

  merge:
    name: Auto-merge to main
    needs: verify
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Open & merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "feat: verified content from admin dashboard ($BRANCH)" \
            --body "Auto-generated by DevSpace Admin Dashboard after successful verification." \
            --label "admin" || true)
          if [ -n "$PR_URL" ]; then
            gh pr merge "$PR_URL" --squash --delete-branch || true
          fi
