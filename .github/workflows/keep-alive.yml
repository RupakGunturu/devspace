name: Keep Backend Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl -sf --max-time 90 https://devspace-d8nq.onrender.com/api/health || exit 1
      - name: Report failure
        if: failure()
        run: echo "::error::Backend health check failed — Render may be down or restarting."